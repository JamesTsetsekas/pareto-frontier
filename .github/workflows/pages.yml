name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed snapshot (keeps the fallback fresh and the repo active)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest ARC Prize leaderboard
        run: node scripts/fetch-arc.mjs

      - name: Fetch latest LiveBench release
        run: node scripts/fetch-livebench.mjs

      - name: Fetch Artificial Analysis Intelligence Index
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }} # free key; the step skips cleanly without it
        run: node scripts/fetch-aa.mjs

      - name: Commit snapshots that changed
        run: |
          # fetchedAt changes every run; only commit files whose actual data changed.
          strip='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);delete j.fetchedAt;console.log(JSON.stringify(j))})'
          changed=""
          for f in data/arc.json data/livebench.json data/aa.json; do
            [ -f "$f" ] || continue
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git diff --quiet -- "$f" && continue
              old=$(git show "HEAD:$f" | node -e "$strip")
              new=$(node -e "$strip" < "$f")
              [ "$old" = "$new" ] && continue
            fi
            changed="$changed $f"
          done
          [ -z "$changed" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $changed
          git commit -m "Refresh leaderboard data snapshot"
          git push || echo "Push skipped (branch moved); the deploy still uses fresh data"

      - uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
